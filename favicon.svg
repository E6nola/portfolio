<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <!-- Background: Deep Navy Ink matching website theme -->
  <rect width="64" height="64" rx="14" fill="#16213A"/>
  
  <!-- Outer DFD Dashed Track: Muted Navy Blue -->
  <circle cx="32" cy="32" r="23" fill="none" stroke="#2B3A5A" stroke-width="2.2" stroke-dasharray="2.5 2"/>
  
  <!-- 4 Data Flow Lines: Electric Blue -->
  <line x1="14" y1="14" x2="22.5" y2="22.5" stroke="#2147B8" stroke-width="2.6" stroke-linecap="round"/>
  <line x1="50" y1="14" x2="41.5" y2="22.5" stroke="#2147B8" stroke-width="2.6" stroke-linecap="round"/>
  <line x1="14" y1="50" x2="22.5" y2="41.5" stroke="#2147B8" stroke-width="2.6" stroke-linecap="round"/>
  <line x1="50" y1="50" x2="41.5" y2="41.5" stroke="#2147B8" stroke-width="2.6" stroke-linecap="round"/>
  
  <!-- 4 External Nodes: Gold Amber -->
  <circle cx="13" cy="13" r="3.4" fill="#F0B429"/>
  <circle cx="51" cy="13" r="3.4" fill="#F0B429"/>
  <circle cx="13" cy="51" r="3.4" fill="#F0B429"/>
  <circle cx="51" cy="51" r="3.4" fill="#F0B429"/>

  <!-- Central Process Ring: Pure White / Paper border with Deep Center -->
  <circle cx="32" cy="32" r="13.5" fill="#1B2845" stroke="#FFFFFF" stroke-width="2"/>
  
  <!-- Process Zero Core Symbol: Warm Gold Ring -->
  <circle cx="32" cy="32" r="6" fill="none" stroke="#F0B429" stroke-width="2.8"/>
</svg>
